<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Descanso Total | Limpieza</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <header>

        <nav class="navbar barra-personalizada">

            <div class="container-fluid">

                <a
                    class="navbar-brand m-0 p-0"
                    href="../LandingPage/index.html"
                >
                    <img
                        src="../LandingPage/images/logo.png"
                        alt="Logo Hotel Descanso Total"
                        class="logo"
                    >
                </a>

                <ul class="navbar-nav flex-row flex-grow-1 justify-content-around align-items-center">

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="../RF06-Gestionar reservas/index.html"
                        >
                            Reservas
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="../RF07-Check-in/index.html"
                        >
                            Check-in
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link active"
                            href="index.html"
                        >
                            Limpieza
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="../RF09-Check-out y cobro/index.html"
                        >
                            Check-out
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="../RF10-Reportes/index.html"
                        >
                            Reportes
                        </a>
                    </li>

                    <li class="nav-item">

                        <a
                            class="btn btn-outline-danger"
                            href="../LandingPage/index.html"
                        >
                            <i class="bi bi-box-arrow-right"></i>
                            Salir
                        </a>

                    </li>

                </ul>

            </div>

        </nav>

    </header>

    <hr>

    <main class="container py-4">

        <h1 class="text-center">Limpieza</h1>

        <p class="text-center">
            Asignar limpieza y actualizar el estado de la habitación
        </p>

        <br>

        <section class="mb-4">

            <h2 class="h4">Habitaciones pendientes de limpieza</h2>

            <div class="table-responsive">

                <table class="table table-striped align-middle">

                    <thead>

                        <tr>
                            <th>Código</th>
                            <th>Habitación</th>
                            <th>Estado</th>
                            <th>Responsable</th>
                        </tr>

                    </thead>

                    <tbody id="tablaLimpieza"></tbody>

                </table>

            </div>

        </section>

        <div class="row justify-content-center g-4">

            <div class="col-12 col-md-4">

                <div class="card shadow-sm h-100">

                    <div class="card-body">

                        <h2 class="h5 card-title">
                            Habitación
                        </h2>

                        <label
                            for="habitacion"
                            class="form-label"
                        >
                            Habitación
                        </label>

                        <select
                            id="habitacion"
                            name="habitacion"
                            class="form-select"
                        >
                            <option value="">
                                Seleccionar...
                            </option>
                        </select>

                        <p
                            id="resultado"
                            class="mt-2 mb-0"
                        ></p>

                    </div>

                </div>

            </div>

            <div class="col-12 col-md-4">

                <div class="card shadow-sm h-100">

                    <div class="card-body">

                        <h2 class="h5 card-title">
                            Asignar persona
                        </h2>

                        <label
                            for="persona"
                            class="form-label"
                        >
                            Camarera de piso
                        </label>

                        <select
                            id="persona"
                            name="persona"
                            class="form-select"
                        >

                            <option value="">
                                Seleccionar...
                            </option>

                            <option value="Benjamín Romero">
                                Benjamín Romero
                            </option>

                            <option value="Camila Castillo">
                                Camila Castillo
                            </option>

                            <option value="Rubén Espejo">
                                Rubén Espejo
                            </option>

                        </select>

                        <button
                            type="button"
                            id="btnAsignar"
                            class="btn btn-primary mt-3"
                            disabled
                        >
                            Asignar
                        </button>

                        <p
                            id="resultado2"
                            class="mt-2 mb-0"
                        ></p>

                    </div>

                </div>

            </div>

            <div class="col-12 col-md-4">

                <div class="card shadow-sm h-100">

                    <div class="card-body">

                        <h2 class="h5 card-title">
                            Estado habitación
                        </h2>

                        <p
                            id="estado"
                            class="fw-semibold"
                        >
                            Selecciona una habitación
                        </p>

                        <button
                            type="button"
                            id="btnIniciar"
                            class="btn btn-primary mb-2"
                            disabled
                        >
                            Iniciar limpieza
                        </button>

                        <button
                            type="button"
                            id="btnCompletar"
                            class="btn btn-success mb-2"
                            disabled
                        >
                            Finalizar limpieza
                        </button>

                        <p
                            id="resultado3"
                            class="mt-2 mb-0"
                        ></p>

                    </div>

                </div>

            </div>

        </div>

        <section class="mt-4">

            <label
                for="observaciones"
                class="form-label"
            >
                Observaciones de la habitación
            </label>

            <textarea
                id="observaciones"
                class="form-control"
                rows="3"
                disabled
            ></textarea>

            <button
                type="button"
                id="btnObservaciones"
                class="btn btn-primary mt-3"
                disabled
            >
                Guardar observaciones
            </button>

            <p
                id="resultadoObservaciones"
                class="mt-2 mb-0"
            ></p>

        </section>

    </main>

    <hr>

    <footer>

    </footer>

    <script src="script.js" defer></script>

</body>
</html>
