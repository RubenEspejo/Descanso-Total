<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hotel Descanso Total | Limpieza</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="estilos.css">
    </head>

    <style>
        h1 {
            text-align: center;
        }
    </style>

    <body>

        <header>
            
            <nav class="navbar navbar-expand bg-light">
                <div class="container-fluid justify-content-between">
                    <a class="navbar-brand" href="../LandingPage/index.html">
                        <img src="../LandingPage/images/logo.png" alt="Logo hotel Descanso Total" class="logo">

                    </a>
                    <a class="btn btn-outline-danger" href="../RF06-Gestionar reservas/index.html">
                        Volver a la pagina anterior
                    </a>
                </div>
            </nav>

        </header>
        <hr>
        <main class="container py-4">
            <h1>Limpieza</h1>
            <p class="text-center">Asignar limpieza y actualizar el estado de la habitacion</p>
            <br>
            
            <div>
            
                <form>
                    
                    <label for="habitacion">Habitación:  </label>
                    <input type="text" id="habitacion" name="habitacion">

                    <p id="resultado"></p>
                </form>
            
            </div>
            <div>
                <form>

                    <label for="persona">Persona asignada: </label>
                    <select id="persona" name="persona">
                        <option value=""> </option>
                        <option value="Benjamín Romero">Benjamín Romero</option>
                        <option value="Camila Castillo">Camila Castillo</option>
                        <option value="Rubén Espejo">Rubén Espejo</option>
                    </select>
                    <button type="button" id="btnAsignar">Asignar</button>
                   
                    <p id="resultado2"></p>
                </form>

            </div>

            <div>
                <form>

                    <label for="estado">Estado habitacion</label>
                    <p id="estado">Pendiente</p>
                    <button type="button" id="btnCompletar" disabled>Marcar como completado</button>
                    <p id="resultado3"></p>
                </form>
            </div>
        </main>
        <hr>  
        <footer>

        </footer>

        <script src="script.js" defer></script>

    </body>








</html>
