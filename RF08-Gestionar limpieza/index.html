<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hotel Descanso Total | Limpieza</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="estilos.css">
    </head>

    <style>
        h1 {
            text-align: center;
        }
    </style>

    <body>

        <header>
            
            <nav class="navbar navbar-expand bg-light">
                <div class="container-fluid justify-content-between">
                    <a class="navbar-brand" href="../LandingPage/index.html">
                        <img src="../LandingPage/images/logo.png" alt="Logo hotel Descanso Total" class="logo">

                    </a>
                    <a class="btn btn-outline-danger" href="../RF06-Gestionar reservas/index.html">
                        Volver a la pagina anterior
                    </a>
                </div>
            </nav>

        </header>
        <hr>
        <main class="container py-4">
            <h1>Limpieza</h1>
            <p class="text-center">Asignar limpieza y actualizar el estado de la habitacion</p>
            <br>
            
            <div class="row justify-content-center g-4">

            <div class="col-12 col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h2 class="h5 card-title">Habitación</h2>
                        <form class="row g-3">
                            <div class="col-12">
                                <label for="habitacion" class="form-label">Habitación</label>
                                <input type="number" id="habitacion" name="habitacion" class="form-control" min="1" placeholder="N° de habitación">
                            </div>
                        </form>
                        <p id="resultado" class="mt-2 mb-0"></p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h2 class="h5 card-title">Asignar persona</h2>
                        <form class="row g-3">
                            <div class="col-md-8">
                                <label for="persona" class="form-label">Persona asignada</label>
                                <select id="persona" name="persona" class="form-select">
                                    <option value=""> </option>
                                    <option value="Benjamín Romero">Benjamín Romero</option>
                                    <option value="Camila Castillo">Camila Castillo</option>
                                    <option value="Rubén Espejo">Rubén Espejo</option>
                                </select>
                            </div>
                            <div class="col-md-4 d-flex align-items-end">
                                <button type="button" id="btnAsignar" class="btn btn-primary w-100">Asignar</button>
                            </div>
                        </form>
                        <p id="resultado2" class="mt-2 mb-0"></p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h2 class="h5 card-title">Estado habitación</h2>
                        <p id="estado" class="fw-semibold">Pendiente</p>
                        <button type="button" id="btnCompletar" class="btn btn-primary" disabled>Marcar como completado</button>
                        <p id="resultado3" class="mt-2 mb-0"></p>
                    </div>
                </div>
            </div>

        </main>
        <hr>  
        <footer>

        </footer>

        <script src="script.js" defer></script>

    </body>








</html>
