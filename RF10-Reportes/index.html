<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Descanso Total | Reportes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
    </head>

   

    <body>

        <header>
        <nav class="navbar navbar-expand bg-light">
            <div class="container-fluid justify-content-between">
                <a class="navbar-brand" href="../LandingPage/index.html">
                    <img src="../LandingPage/images/logo.png" alt="Logo hotel Descanso Total" class="logo">
                </a>
                <a class="btn btn-outline-danger" href="../RF06-Gestionar reservas/index.html">
                    Volver a la pagina anterior
                </a>
            </div>
        </nav>
    </header>

        <hr>
        <main class="container py-4">

            <h1>Reportes</h1>
            <p class="text-center">Mostrar ocupación e ingresos de los datos de prueba</p>
            <br>

            <div class="row justify-content-center g-4">

            <div class="col-12 col-md-8">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h2 class="h5 card-title">Generar reporte</h2>

                        <form class="row g-3">
                            <div class="col-md-5">
                                <label for="desde" class="form-label">Desde</label>
                                <input type="date" id="desde" name="desde" class="form-control">
                            </div>
                            <div class="col-md-5">
                                <label for="hasta" class="form-label">Hasta</label>
                                <input type="date" id="hasta" name="hasta" class="form-control">
                            </div>
                            <div class="col-md-2 d-flex align-items-end">
                                <button type="button" id="btnGenerar" class="btn btn-primary w-100">Generar</button>
                            </div>
                        </form>

                        <p id="resultado" class="mt-3 mb-0"></p>
                    </div>
                </div>
            </div>

        </div>

            

        </main>
        <hr>  
         <footer class="text-center py-3">
            <p>&copy; 2026 Hotel Descanso Total · Viña del Mar, Chile</p>
        </footer>

        <script src="script.js" defer></script>

    </body>
