<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hotel Descanso Total | Check-in</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="estilos.css">
    </head>

    <style>
        h1 {
            text-align: center;
        }
    </style>

    <body>

        <header>
            
            <h1>Check-in</h1>
            <p>Validar reserva y habitacion lista; registrar registro</p>

        </header>

        <hr>

        <main>
            <div>
            
                <form>

                    
                    <label for="codigo">Validar codigo: </label>
                    <input type="text" id="codigo" name="codigo">
                    <button type="button" id="btnValidar">OK</button>

                    <p id="resultado"></p>
                </form>
            
            </div>
            <br>

            <div>
                <form>

                    <label for="registro">Codigo de reserva:</label>
                    <input type="text" id="registro" name="registro">
                    <button type="button" id="btnRegistrar">OK</button>

                    <p id="resultado2"></p>
                </form>

            </div>
           


        </main>

        <hr>
        
        <footer>

        </footer>

        <script src="script.js" defer></script>

    </body>








</html>
