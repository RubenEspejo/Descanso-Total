        <link rel="stylesheet" href="estilos.css">

    </head>


    <body>

        <header>

        <nav class="navbar barra-personalizada">

            <div class="container-fluid">

                <a class="navbar-brand m-0 p-0"
                href="../LandingPage/index.html">

                    <img
                        src="../LandingPage/images/logo.png"
                        alt="Logo Hotel Descanso Total"
                        class="logo">

                </a>

                <ul class="navbar-nav flex-row flex-grow-1 justify-content-around align-items-center">

                    <li class="nav-item">
                        <a class="nav-link"
                        href="../RF06-Gestionar reservas/index.html">
                            Reservas
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active"
                        href="../RF07-Check-in/index.html">
                            Check-in
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                        href="../RF08-Gestionar limpieza/index.html">
                            Limpieza
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                        href="../RF09-Check-out y cobro/index.html">
                            Check-out

                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                        href="../RF10-Reportes/index.html">
                            Reportes

                    <li class="nav-item">

                            <i class="bi bi-box-arrow-right"></i>
                            Salir

                        </a>
                    </li>

                </ul>

            </div>

        </nav>

        </header>

        <hr>

        <main class="container py-4">

            <h1>Check-in</h1>
            <p class="text-center">Validar reserva y habitacion lista; registrar registro</p>
            <br>
            <div class="row justify-content-center g-4">

            <div class="col-12 col-md-6">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h2 class="h5 card-title">Validar reserva</h2>

                        <form class="row g-3">
                            <div class="col-md-8">
                                <label for="codigo" class="form-label">Validar código</label>
                                <input type="text" id="codigo" name="codigo" class="form-control" placeholder="Código de reserva">
                            </div>
                            <div class="col-md-4 d-flex align-items-end">
                                <button type="button" id="btnValidar" class="btn btn-primary w-100">OK</button>
                            </div>
                        </form>
                        <p id="resultado" class="mt-2 mb-0"></p>
                    </div>
                </div>
            </div>
            <br>

            <div class="col-12 col-md-6">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h2 class="h5 card-title">Registrar check-in</h2>

                        <form class="row g-3">
                            <div class="col-md-8">
                                <label for="registro" class="form-label">Código de reserva</label>
                                <input type="text" id="registro" name="registro" class="form-control" placeholder="Código de reserva">
                            </div>
                            <div class="col-md-4 d-flex align-items-end">
                                <button type="button" id="btnRegistrar" class="btn btn-primary w-100">OK</button>
                            </div>
                        </form>
                        <p id="resultado2" class="mt-2 mb-0"></p>
                    </div>
                </div>
            </div>

        </div>
           
        </main>

        <hr>
        
        <footer class="text-center py-3">
            <p>&copy; 2026 Hotel Descanso Total · Viña del Mar, Chile</p>
        </footer>

        <script src="script.js" defer></script>

    </body>

</html>
