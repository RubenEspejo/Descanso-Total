<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Descanso Total | Check-out y cobros</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <header>

        <nav class="navbar barra-personalizada">

            <div class="container-fluid">

                <a
                    class="navbar-brand m-0 p-0"
                    href="../LandingPage/index.html"
                >
                    <img
                        src="../LandingPage/images/logo.png"
                        alt="Logo Hotel Descanso Total"
                        class="logo"
                    >
                </a>

                <ul class="navbar-nav flex-row flex-grow-1 justify-content-around align-items-center">

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="../RF06-Gestionar reservas/index.html"
                        >
                            Reservas
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="../RF07-Check-in/index.html"
                        >
                            Check-in
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="../RF08-Gestionar limpieza/index.html"
                        >
                            Limpieza
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link active"
                            href="index.html"
                        >
                            Check-out
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="../RF10-Reportes/index.html"
                        >
                            Reportes
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="btn btn-outline-danger"
                            href="../LandingPage/index.html"
                        >
                            <i class="bi bi-box-arrow-right"></i>
                            Salir
                        </a>
                    </li>

                </ul>

            </div>

        </nav>

    </header>

    <hr>

    <main class="container py-4">

        <h1 class="text-center">Check-out y cobros</h1>

        <p class="text-center">
            Calcula el total y deja la habitación pendiente de limpieza
        </p>

        <br>

        <div class="row justify-content-center g-4">

            <div class="col-12 col-md-6">

                <div class="card shadow-sm h-100">

                    <div class="card-body">

                        <h2 class="h5 card-title">
                            Calcular cobro
                        </h2>

                        <form class="row g-3">

                            <div class="col-md-8">

                                <label
                                    for="codigo"
                                    class="form-label"
                                >
                                    Código de reserva
                                </label>

                                <input
                                    type="text"
                                    id="codigo"
                                    name="codigo"
                                    class="form-control"
                                    placeholder="Ej: DT-1234"
                                >

                            </div>

                            <div class="col-md-4 d-flex align-items-end">

                                <button
                                    type="button"
                                    id="btnCalcular"
                                    class="btn btn-primary w-100"
                                >
                                    Calcular
                                </button>

                            </div>

                        </form>

                        <p
                            id="resultado"
                            class="mt-3 mb-0"
                        ></p>

                    </div>

                </div>

            </div>

            <div class="col-12 col-md-6">

                <div class="card shadow-sm h-100">

                    <div class="card-body">

                        <h2 class="h5 card-title">
                            Comprobante
                        </h2>

                        <div id="comprobante">

                            <p class="text-muted">
                                Ingresa una reserva para calcular el cobro.
                            </p>

                        </div>

                        <button
                            type="button"
                            id="btnConfirmar"
                            class="btn btn-success mt-3"
                            disabled
                        >
                            Confirmar check-out
                        </button>

                        <p
                            id="resultadoConfirmacion"
                            class="mt-3 mb-0"
                        ></p>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <hr>

    <footer class="text-center py-3">

        <p>
            &copy; 2026 Hotel Descanso Total · Viña del Mar, Chile
        </p>

    </footer>

    <script src="script.js" defer></script>

</body>
</html>
