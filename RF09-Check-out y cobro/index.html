<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cobros</title>
    </head>

    <body>

        <header>
        <nav class="navbar navbar-expand bg-light">
            <div class="container-fluid justify-content-between">
                <a class="navbar-brand" href="../LandingPage/index.html">
                    <img src="../LandingPage/images/logo.png" alt="Logo hotel Descanso Total" class="logo">
                </a>
                <a class="btn btn-outline-danger" href="../RF06-Gestionar reservas/index.html">
                    Volver a la pagina anterior
                </a>
            </div>
        </nav>
         </header>
        <hr>
        <main class="container py-4">

            <h1>Check-out y cobros</h1>
            <p class="text-center">Calcular total y dejar la habitación pendiente de limpieza</p>
            <br>
            <div class="row justify-content-center g-4">

            <div class="col-12 col-md-6">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h2 class="h5 card-title">Calcular cobro</h2>

                        <form class="row g-3">
                            <div class="col-md-8">
                                <label for="noches" class="form-label">Noches</label>
                                <input type="number" id="noches" name="noches" class="form-control" min="1" placeholder="N° de noches">
                            </div>
                            <div class="col-md-4 d-flex align-items-end">
                                <button type="button" id="btnIngresar" name="ingresar" class="btn btn-primary w-100">OK</button>
                            </div>
                        </form>
                        <p id="resultado" class="mt-3 mb-0"></p>
                    </div>
                </div>
            </div>

        </div>
            

        </main>
        <hr>  
        <footer class="text-center py-3">
            <p>&copy; 2026 Hotel Descanso Total · Viña del Mar, Chile</p>

        </footer>

        <script src="script.js" defer></script>

    </body>








</html>
