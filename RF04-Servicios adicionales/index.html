<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios Adicionales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body class="bg-light p-4">

    <div class="container d-flex justify-content-center">
        <div class="card shadow-sm border-info-subtle" style="max-width: 450px; width: 100%;">
            <div class="card-body">
                <div class="d-flex align-items-center gap-2 mb-3">
                    <h5 class="card-title m-0 fw-bold text-dark-emphasis">Servicios adicionales</h5>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-bordered table-striped align-middle mb-2">
                        <thead class="table-primary">
                            <tr>
                                <th>Servicio</th>
                                <th class="text-end" style="width: 100px;">Cantidad</th>
                                <th class="text-end">Subtotal</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Desayuno</td>
                                <td>
                                    <select class="form-select form-select-sm qty-select" data-price="25000">
                                        <option value="0">0</option>
                                        <option value="1" selected>1</option>
                                        <option value="2">2</option>
                                        <option value="3">3</option>
                                    </select>
                                </td>
                                <td class="text-end fw-semibold subtotal">$ 25.000</td>
                            </tr>
                            <tr>
                                <td>Spa</td>
                                <td>
                                    <select class="form-select form-select-sm qty-select" data-price="15000">
                                        <option value="0" selected>0</option>
                                        <option value="1">1</option>
                                        <option value="2">2</option>
                                    </select>
                                </td>
                                <td class="text-end fw-semibold subtotal">$ 0</td>
                            </tr>
                            <tr>
                                <td>Cena</td>
                                <td>
                                    <select class="form-select form-select-sm qty-select" data-price="35000">
                                        <option value="0">0</option>
                                        <option value="1">1</option>
                                        <option value="2" selected>2</option>
                                        <option value="3">3</option>
                                    </select>
                                </td>
                                <td class="text-end fw-semibold subtotal">$ 70.000</td>
                            </tr>
                            <tr>
                                <td>Estacionamiento</td>
                                <td>
                                    <select class="form-select form-select-sm qty-select" data-price="15000">
                                        <option value="0">0</option>
                                        <option value="1" selected>1</option>
                                        <option value="2">2</option>
                                    </select>
                                </td>
                                <td class="text-end fw-semibold subtotal">$ 15.000</td>
                            </tr>
                        </tbody>
                        <tfoot class="table-group-divider">
                            <tr class="table-info fw-bold">
                                <td colspan="2" class="text-end">Total servicios:</td>
                                <td class="text-end text-primary" id="grand-total">$ 110.000</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>

                <div class="alert alert-info py-2 px-3 m-0 mt-2 fs-7" role="alert">
                    Agregar servicios a la reserva y actualizar el total.
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
